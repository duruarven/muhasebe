<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>İşletmem Muhasebe</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="sales-editor.css" />
    <link rel="stylesheet" href="mobile.css" />
  </head>
  <body>
    <div class="app-menubar">
      <div class="app-brand">
        <img src="icons/home.svg" alt="" /> İşletmem Muhasebe
      </div>
      <div id="app-menus"></div>
      <span class="app-edition">Ön Muhasebe · 0.6.0</span>
    </div>
    <aside class="sidebar">
      <nav aria-label="Ana menü">
        <button
          data-view="overview"
          aria-label="Genel bakış"
          title="Genel bakış"
        >
          <img src="icons/home.svg" alt="" /><span>Ana ekran</span>
        </button>
        <button
          data-view="products"
          aria-label="Ürün & stok"
          title="Ürün ve stok kartları"
        >
          <img src="icons/stock.svg" alt="" /><span>Stok</span>
        </button>
        <button
          data-view="contacts"
          aria-label="Cari hesaplar"
          title="Cari kart tanımları"
        >
          <img src="icons/contacts.svg" alt="" /><span>Cari</span>
        </button>
        <button
          data-view="transactions"
          aria-label="Tahsilat & ödeme"
          title="Tahsilat ve ödeme işlemleri"
        >
          <img src="icons/entries.svg" alt="" /><span>İşlemler</span>
        </button>
        <button
          data-view="invoices"
          aria-label="Faturalar"
          title="Alış ve satış faturaları"
        >
          <img src="icons/invoice.svg" alt="" /><span>Fatura</span>
        </button>
        <button
          data-view="accounts"
          aria-label="Kasa & banka"
          title="Kasa ve banka hesapları"
        >
          <img src="icons/cash.svg" alt="" /><span>Kasa</span>
        </button>
        <button
          data-view="reports"
          aria-label="Raporlar"
          title="Cari bakiye raporu"
        >
          <img src="icons/report.svg" alt="" /><span>Raporlar</span>
        </button>
      </nav>
      <button
        id="backup"
        class="backup"
        title="Verileri yedekle"
        aria-label="Verilerimi yedekle"
      >
        <img src="icons/backup.svg" alt="" /><span>Yedek</span>
      </button>
    </aside>
    <main>
      <div id="workspace-tabs" class="workspace-tabs"></div>
      <header>
        <div>
          <p id="eyebrow">İŞLETMEM ÖN MUHASEBE</p>
          <h1 id="title">Genel bakış</h1>
          <p id="subtitle"></p>
        </div>
        <div id="page-actions" class="actions"></div>
      </header>
      <div id="notice" role="status" aria-live="polite"></div>
      <section id="summary" class="summary"></section>
      <section id="content"></section>
    </main>
    <div class="statusbar">
      <span id="status-location">Hazır</span><span>Para birimi: TL</span
      ><span>Veriler bu bilgisayarda saklanır</span><span id="today"></span>
    </div>
    <dialog id="modal" aria-labelledby="modal-title">
      <div class="modal-header">
        <div>
          <p id="modal-kicker">İŞLETMEM</p>
          <h2 id="modal-title"></h2>
        </div>
        <button
          id="modal-close"
          class="icon-button"
          aria-label="Pencereyi kapat"
        >
          ✕
        </button>
      </div>
      <div id="modal-body"></div>
      <div id="modal-error" role="alert"></div>
    </dialog>
    <script src="domain.js"></script>
    <script src="sales-editor.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
