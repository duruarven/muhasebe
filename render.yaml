services:
  - type: web
    name: isletmem-muhasebe
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: node src/web-server.js
    healthCheckPath: /healthz
    disk:
      name: muhasebe-verileri
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: APP_PASSWORD
        generateValue: true
      - key: DATA_DIR
        value: /var/data
